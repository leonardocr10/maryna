services:
  api:
    build: ./api
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"]
    env_file: ./api/.env
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      PYTHON_BIN: python3
      DB_FILE: /app/data/neurolaudos.db
    volumes:
      - ./api/storage:/app/storage
      - ./api/data:/app/data
      - ./worker:/app/worker:ro
      - ./db:/app/db:ro
